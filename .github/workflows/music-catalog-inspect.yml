name: Inspect public Muzmos search
on:
  pull_request:
    paths: ['.github/workflows/music-catalog-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public search results markup
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          from html.parser import HTMLParser
          from collections import Counter
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__(); self.count=Counter(); self.samples=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'data-track' in a or 'data-title' in a or 'snd-item' in a.get('class',''):
                      self.count[(tag, a.get('class',''), tuple(sorted(k for k in a if k.startswith('data-'))))]+=1
                      if 'data-track' in a and len(self.samples)<3:
                          u=urllib.parse.urlsplit(a['data-track'])
                          self.samples.append((u.netloc, u.path[:30], u.path[-4:]))
          for q in ['Кино Кукушка', 'Queen', 'Metallica']:
              try:
                  url='https://muzmos.com/search/?q='+urllib.parse.quote_plus(q)
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'JuzeppeOS Music/1.0'}), timeout=15) as r:
                      body=r.read(2000000).decode('utf-8',errors='replace')
                      h=Inspect(); h.feed(body)
                      print('query:',q,'location:',r.url,'status:',r.status,'size:',len(body),'title:',re.findall(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)[:1])
                      print('markup',h.count.most_common(12),'audio paths',h.samples)
                      print('mp3 tags',body.lower().count('.mp3'),'data-track',body.lower().count('data-track'))
              except Exception as e:
                  print(type(e).__name__,str(e))
          PY
