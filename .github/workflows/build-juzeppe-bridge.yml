name: Build Juzeppe Bridge
on:
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/build-juzeppe-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/build-juzeppe-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build server mod
        working-directory: bridge
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: juzeppe-bridge-0.2.1
          path: bridge/build/libs/juzeppe-bridge-0.2.1.jar
          if-no-files-found: error
