plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
group = 'icu.juzeppe'
version = '0.3.0'
base { archivesName = 'juzeppe-bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.squiddev.cc' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = '21.1.200'
    mods { juzeppe_bridge { sourceSet sourceSets.main } }
}
dependencies {
    jarJar(implementation('javazoom:jlayer:1.0.1')) {
        version { strictly '[1.0.1,1.0.2)'; prefer '1.0.1' }
    }
    jarJar(implementation('org.jsoup:jsoup:1.21.2')) {
        version { strictly '[1.21.2,1.22)'; prefer '1.21.2' }
    }
    // Create 6.0.8 and CC:T 1.116.1, Minecraft 1.21.1 NeoForge.
    compileOnly 'maven.modrinth:create:88L641Un'
    compileOnly 'maven.modrinth:gu7yAYhd:SQI2qmh5'
    compileOnly 'net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.64'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.5'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A generated tone and synthetic catalog fixture verify the decoder independently of Minecraft.
tasks.register('musicSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icu.juzeppe.bridge.MusicSmoke'
    args project.findProperty('musicTestFile') ?: ''
    if (project.hasProperty('liveMusicSearch')) args 'live'
}
